name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a build-only branch run (ignored when running a Git tag)'
        type: string
        required: true
        default: '0.1.0'

permissions:
  contents: read

# Never interrupt an upload in progress. The called CI has its own ci-* group.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  validate:
    name: Validate version and source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release tag
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = $env:REF_TYPE -eq 'tag'
          $tag = if ($publish) { $env:REF_NAME } else { "v$env:BUILD_VERSION" }
          $release = ./build/Get-ReleaseVersion.ps1 -Tag $tag
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the source commit.' }
          if ($publish) {
            git merge-base --is-ancestor $commit refs/remotes/origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to commits already integrated into main.' }
          }
          @(
            "tag=$($release.Tag)"
            "version=$($release.Version)"
            "prerelease=$($release.IsPrerelease.ToString().ToLowerInvariant())"
            "publish=$($publish.ToString().ToLowerInvariant())"
            "commit=$commit"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  verify:
    name: Release quality checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Package (${{ matrix.runtime }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-22.04
            runtime: linux-x64
          - os: macos-15-intel
            runtime: osx-x64
          - os: macos-15
            runtime: osx-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish and package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_RUNTIME: ${{ matrix.runtime }}
        run: ./build/Publish-Release.ps1 -Version $env:RELEASE_VERSION -Runtime $env:RELEASE_RUNTIME -SmokeTest:$IsMacOS

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.runtime }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  checksums:
    name: Verify package set and hash assets
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Platform artifact names have two hyphens; exclude a previous checksum
          # artifact when this job is retried within the same workflow run.
          pattern: release-*-*
          merge-multiple: true
          path: release-assets

      - name: Create SHA-256 manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: ./build/Write-ReleaseChecksums.ps1 -Version $env:RELEASE_VERSION -Directory release-assets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checksums
          path: release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, verify, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Verify the tag and publish all assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.commit }}
          IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The get-by-tag endpoint can miss drafts. List every release with the
          # authenticated publisher token, and fail closed if that request fails.
          existing_tags="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')"
          while IFS= read -r existing_tag; do
            if [[ "$existing_tag" == "$RELEASE_TAG" ]]; then
              echo 'A release or draft already exists for this tag; inspect it before recovery.' >&2
              exit 1
            fi
          done <<< "$existing_tags"
          remote_tag="$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          remote_commit="$(printf '%s\n' "$remote_tag" | awk '$2 ~ /\^\{\}$/ {print $1}')"
          if [[ -z "$remote_commit" ]]; then
            remote_commit="$(printf '%s\n' "$remote_tag" | awk '{print $1}')"
          fi
          if [[ "$remote_commit" != "$RELEASE_SHA" ]]; then
            echo 'The remote tag no longer points to the tested commit.' >&2
            exit 1
          fi
          cd release-assets
          sha256sum --check SHA256SUMS
          options=(--verify-tag --generate-notes --title "DevNotes $RELEASE_TAG")
          options+=(--notes 'Portable packages with the .NET runtime included. Extract the entire archive and verify it against SHA256SUMS. Windows binaries are unsigned; macOS bundles have ad-hoc signatures and are not notarized. See build/README.md in the tagged source for requirements and launch instructions.')
          if [[ "$IS_PRERELEASE" == 'true' ]]; then
            options+=(--prerelease --latest=false)
          fi
          # gh creates a draft, uploads every asset, then publishes. No clobber or
          # deletion is used; existing releases were rejected above.
          gh release create "$RELEASE_TAG" "${options[@]}" \
            "DevNotes-$RELEASE_TAG-win-x64.zip" \
            "DevNotes-$RELEASE_TAG-linux-x64.tar.gz" \
            "DevNotes-$RELEASE_TAG-osx-x64.tar.gz" \
            "DevNotes-$RELEASE_TAG-osx-arm64.tar.gz" SHA256SUMS
